[package]
name = "ampello-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Platform-independent core of Ampello: data model, storage and trigger matching"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
