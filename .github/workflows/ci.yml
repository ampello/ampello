name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  core:
    name: Core (platform-free)
    # The core crate carries no platform dependency, so proving that on Linux
    # is what stops one creeping in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/crates/ampello-core/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/crates/ampello-core/Cargo.toml -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/crates/ampello-core/Cargo.toml

  app:
    name: App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
